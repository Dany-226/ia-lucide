name: IndexNow notification

# Remplace l'étape manuelle documentée historiquement dans CLAUDE.md
# (npm run indexnow -- --urls=... après chaque publication d'article).

on:
  push:
    branches: [main]
    paths:
      - 'content/**.mdx'

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Détecter les .mdx ajoutés/modifiés et construire les URLs
        id: urls
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          # Push initial d'une branche / avant inconnu : avant = 40 zéros.
          # Dans ce cas, on diffe contre l'arbre vide pour traiter tous les
          # fichiers du push comme "ajoutés" plutôt que d'échouer.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$EMPTY_TREE"
          fi

          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$SHA" -- 'content/*.mdx' || true)

          if [ -z "$CHANGED" ]; then
            echo "Aucun fichier .mdx ajouté/modifié détecté sur ce push."
            echo "urls=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Fichiers .mdx détectés :"
          echo "$CHANGED"

          URLS=""
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && continue

            SLUG=$(grep -m1 -E '^slug:' "$FILE" | sed -E 's/^slug: *"?([^"]*)"?[[:space:]]*$/\1/')
            [ -z "$SLUG" ] && continue

            URL="https://ialucide.fr/article/${SLUG}/"
            if [ -z "$URLS" ]; then
              URLS="$URL"
            else
              URLS="$URLS,$URL"
            fi
          done <<< "$CHANGED"

          echo "URLs à notifier : $URLS"
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"

      - name: Aucune URL à notifier — fin propre
        if: steps.urls.outputs.urls == ''
        run: echo "Rien à notifier à IndexNow pour ce push."

      - name: Install dependencies
        if: steps.urls.outputs.urls != ''
        run: npm ci

      - name: Attendre que chaque URL soit en ligne (200)
        if: steps.urls.outputs.urls != ''
        run: |
          IFS=',' read -ra URL_ARRAY <<< "${{ steps.urls.outputs.urls }}"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15

          for URL in "${URL_ARRAY[@]}"; do
            echo "Attente de $URL (jusqu'à $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) min)..."
            ATTEMPT=0
            STATUS="000"
            until [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; do
              ATTEMPT=$((ATTEMPT + 1))
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "  [$ATTEMPT/$MAX_ATTEMPTS] $URL -> 200 OK"
                break
              fi
              echo "  [$ATTEMPT/$MAX_ATTEMPTS] $URL -> $STATUS, nouvelle tentative dans ${SLEEP_SECONDS}s"
              sleep "$SLEEP_SECONDS"
            done

            if [ "$STATUS" != "200" ]; then
              echo "::error::$URL n'a jamais répondu 200 après $MAX_ATTEMPTS tentatives. Abandon (pas de soumission IndexNow)."
              exit 1
            fi
          done

      - name: Soumettre à IndexNow
        if: steps.urls.outputs.urls != ''
        run: npm run indexnow -- --urls="${{ steps.urls.outputs.urls }}"
